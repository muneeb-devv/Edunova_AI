{% extends "base.html" %}
{% block title %}Log in — EduNova AI{% endblock %}
{% block page_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-eyebrow">WELCOME BACK</div>
    <h2>Log in</h2>
    <p class="auth-sub">Pick up right where you left off.</p>

    <form method="POST" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token }}">
        <label>Roll number
            <input type="text" name="roll" required autofocus>
        </label>
        <label>Password
            <div class="password-field">
                <input type="password" name="password" required>
                {% include "_password_toggle.html" %}
            </div>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a> ·
        New here? <a href="{{ url_for('register') }}">Register</a>
    </p>
</div>
{% endblock %}
