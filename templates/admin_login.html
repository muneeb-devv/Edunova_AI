{% extends "base.html" %}
{% block title %}Admin Login — EduNova AI{% endblock %}
{% block page_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-eyebrow">TEACHER / ADMIN</div>
    <h2>Admin panel</h2>
    <p class="auth-sub">Manage courses, topics, and quiz questions.</p>

    <form method="POST" class="form">
        <label>Admin password
            <div class="password-field">
                <input type="password" name="password" required autofocus>
                {% include "_password_toggle.html" %}
            </div>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('index') }}">Back to site</a></p>
</div>
{% endblock %}
