{% extends "base.html" %}
{% block title %}Reset password — EduNova AI{% endblock %}
{% block page_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-eyebrow">ACCOUNT RECOVERY</div>
    <h2>Reset your password</h2>
    <p class="auth-sub">Confirm your name and roll number to set a new one.</p>

    <form method="POST" class="form">
        <label>Full name
            <input type="text" name="name" required autofocus>
        </label>
        <label>Roll number
            <input type="text" name="roll" required>
        </label>
        <label>New password <span class="hint">min 8 characters</span>
            <div class="password-field">
                <input type="password" name="new_password" required minlength="8">
                {% include "_password_toggle.html" %}
            </div>
        </label>
        <label>Confirm new password
            <div class="password-field">
                <input type="password" name="confirm_password" required minlength="8">
                {% include "_password_toggle.html" %}
            </div>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
